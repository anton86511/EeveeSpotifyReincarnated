name: Publish verified HQ 4 IPA

on: workflow_dispatch

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/codex/hq4-release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish the verified IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v7.5.0-spotify-9.2.2-hq4-cpu-gpu
          source_commit=7faa782d253990938f1edc2801a85e0ffe599964
          asset=EeveeSpotify-9.2.2-HQ4-CPU-GPU.ipa
          digest=889e54985f6f3c51f6dc68ae7808e37480db99db7aa4e3b4ca012d238f7a90ac
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          cd "$work_dir"
          gh run download 45431662384 --repo "$GITHUB_REPOSITORY" --name EeveeSpotify-IPA --dir .
          mv EeveeSpotify-7.5.0-9.2.2.ipa "$asset"
          printf '%s  %s\n' "$digest" "$asset" | sha256sum -c
          cat > release-notes.md <<'NOTES'
          Spotify 9.2.2 的 HQ 4 AI 去人聲新增三個運算檔位。

          - **僅 CPU**：AI 推論使用 CPU，支援鎖屏時繼續處理。
          - **GPU 優先**：前景允許 Core ML 使用 GPU，加速不可用時暫用中央人聲抑制。
          - **CPU＋GPU（預設）**：前景允許 CPU 與 GPU，鎖屏或進入背景時以 CPU 繼續 AI 去人聲。

          到 **EeveeSpotify 設定 → 播放去人聲 → AI 運算模式**切換。IPA 已內建 HQ 4 模型。
          NOTES
          gh release create "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --draft --target "$source_commit" --title 'EeveeSpotify 7.5.0 · Spotify 9.2.2 · HQ 4 CPU／GPU 三檔版' --notes-file release-notes.md
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets > assets.json
          jq -e --arg asset "$asset" '.assets | any(.name == $asset and .size == 187517298)' assets.json
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=true
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,isDraft,assets
