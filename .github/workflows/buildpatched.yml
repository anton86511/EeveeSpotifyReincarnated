name: Build IPA (PATCHED)
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        default: "Master"
        required: true
        type: string
      ipa_url:
        description: "URL to a decrypted Spotify IPA (optional — IPA build is skipped if empty)"
        default: ""
        required: false
        type: string
      uvr_hq4:
        description: "Include UVR Inst HQ 4 for live vocal removal (iOS 16+, Spotify 9.2.0/9.2.2)"
        default: false
        required: false
        type: boolean
      mel_band_roformer:
        description: "Include 2-second Mel-Band RoFormer and UVR Inst HQ 4"
        default: false
        type: boolean
      upload_method:
        description: "Where to upload the built IPA"
        default: "artifacts"
        required: true
        type: choice
        options:
          - artifacts
          - github_release
          - filebin
          - both

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  mel-band-model:
    if: ${{ inputs.mel_band_roformer }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export and validate Mel-Band RoFormer
        run: |
          git apply EeveeSpotify-UVR-HQ4.patch
          python -m pip install 'torch==2.7.0' 'coremltools==9.0' 'numpy<2' 'einops==0.8.1' 'beartype' 'librosa' 'rotary-embedding-torch==0.3.5' 'huggingface-hub'
          python Tools/prepare-mel-band-roformer.py "$RUNNER_TEMP/MelBandRoFormer2s.mlpackage"
          xcrun --sdk iphoneos coremlcompiler compile "$RUNNER_TEMP/MelBandRoFormer2s.mlpackage" "$RUNNER_TEMP"
          test -s "$RUNNER_TEMP/MelBandRoFormer2s.mlmodelc/weights/weight.bin"
          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/john-rocky/coreai-model-zoo/e70996c531ad7d58b5cd7218b703d5b369cb34d0/LICENSE' \
            -o "$RUNNER_TEMP/MelBandRoFormer-LICENSE.txt"
          tar -cf "$RUNNER_TEMP/MelBandRoFormer2s.tar" -C "$RUNNER_TEMP" \
            MelBandRoFormer2s.mlmodelc MelBandRoFormer-LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RoFormer-model
          path: ${{ runner.temp }}/MelBandRoFormer2s.tar
          if-no-files-found: error

  build:
    needs: mel-band-model
    if: ${{ !cancelled() && (needs.mel-band-model.result == 'success' || needs.mel-band-model.result == 'skipped') }}
    runs-on: macos-26-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          submodules: recursive

      - name: Apply the HQ 4 source patch
        if: ${{ inputs.uvr_hq4 || inputs.mel_band_roformer }}
        run: |
          git apply --check EeveeSpotify-UVR-HQ4.patch
          git apply EeveeSpotify-UVR-HQ4.patch

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1.1'

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install build tools
        run: |
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          python3 -m pip install --upgrade --break-system-packages \
              git+https://github.com/asdfzxcvbn/pyzule-rw.git
          # releases/latest/download redirect avoids api.github.com rate limit (anon 60/hr -> 403)
          ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && SUFFIX=macos-amd64 || SUFFIX=macos-arm64
          sudo curl -fsSL "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}" \
              -o /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch
          ipapatch --help >/dev/null

      - name: Build EeveeSwiftProtobuf.framework from source
        env:
          SWIFTPROTOBUF_VERSION: ${{ env.SWIFTPROTOBUF_VERSION }}
        run: |
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      - name: Build .deb (rootless)
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
          DEB_PATH=$(find packages -name "com.eevee.spotify_*.deb" | head -1)
          [ -n "$DEB_PATH" ] || { echo "deb not produced" >&2; exit 1; }
          echo "DEB_PATH=$DEB_PATH"   >> $GITHUB_ENV
          echo "DEB_NAME=$(basename "$DEB_PATH")" >> $GITHUB_ENV

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_NAME }}
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error

      # ─── IPA build (only when ipa_url is provided) ───────────────────
      
      - uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Validate vanilla IPA
        if: ${{ inputs.ipa_url != '' }}
        env:
          SOURCE_IPA_URL: ${{ inputs.ipa_url }}
        run: |
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location \
            --output "$GITHUB_WORKSPACE/spotify.ipa" -- "$SOURCE_IPA_URL"
          file_type=$(file --mime-type -b "$GITHUB_WORKSPACE/spotify.ipa")
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Not a valid IPA: $file_type"
            exit 1
          fi

      - name: Build zxPluginsInject.dylib
        if: ${{ inputs.ipa_url != '' }}
        run: |
          chmod +x Tools/build-zxpi.sh
          Tools/build-zxpi.sh

      - name: Fetch OpeninSafariSpotify extension (.appex)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          # "OpeninSafariSpotify" is commonly distributed as OpenSpotifySafariExtension.appex
          EXT_DIR="$RUNNER_TEMP/OpenSpotifySafariExtension"
          rm -rf "$EXT_DIR"
          git clone --depth 1 https://github.com/BillyCurtis/OpenSpotifySafariExtension.git "$EXT_DIR"
          EXT_SRC="$EXT_DIR/OpenSpotifySafariExtension.appex"
          [ -e "$EXT_SRC" ] || { echo "OpenSpotifySafariExtension.appex not found in repo" >&2; exit 1; }
          echo "OPENSPOTIFY_APPEX=$EXT_SRC" >> $GITHUB_ENV

      - name: Inject deb + framework into IPA (cyan)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          mkdir -p Outputs/IPAS
          DEB_EXTRACT="$RUNNER_TEMP/deb-extract"
          mkdir -p "$DEB_EXTRACT"
          dpkg-deb -R "$DEB_PATH" "$DEB_EXTRACT"

          DYLIB_SRC=$(find "$DEB_EXTRACT" -name 'EeveeSpotify.dylib' | head -1)
          BUNDLE_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSpotify.bundle' | head -1)
          FRAMEWORK_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSwiftProtobuf.framework' | head -1)

          SPOT_VERSION=$(unzip -p ${{ github.workspace }}/spotify.ipa 'Payload/Spotify.app/Info.plist' \
              | plutil -extract CFBundleShortVersionString raw - 2>/dev/null || echo "unknown")
          EEVEE_VERSION=$(grep -E '^Version:' control | awk '{print $2}')
          OUT="Outputs/IPAS/EeveeSpotify-${EEVEE_VERSION}-${SPOT_VERSION}.ipa"

          INJECT=("$DYLIB_SRC")
          [ -n "$FRAMEWORK_SRC" ] && INJECT+=("$FRAMEWORK_SRC")
          [ -n "$BUNDLE_SRC" ]    && INJECT+=("$BUNDLE_SRC")

          # cyan: -du strips appex/Watch (we don't have a wildcard profile),
          # -m 15.0 sets MinimumOSVersion floor, -c 9 max compression.
          cyan -i ${{ github.workspace }}/spotify.ipa -o "$OUT" \
               -f "${INJECT[@]}" -c 9 -m 15.0 -du
          echo "OUT_IPA=$OUT" >> $GITHUB_ENV

      - name: LC-inject zxPluginsInject (ipapatch)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          ipapatch --input "$OUT_IPA" --inplace --noconfirm \
                   --dylib packages/zxPluginsInject.dylib

      - name: Add Pixie download manager (Spotify 9.2.0 and 9.2.2)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          # The download manager lives in the SpotifyAudioProbe.dylib companion, which is only
          # built and bundled by NativeDownloads/tools/build_eevee_9192.py. Without this step the
          # IPA has no companion and Eevee hides the "Download manager" settings row.
          SPOT_VERSION=$(unzip -p "$OUT_IPA" 'Payload/Spotify.app/Info.plist' \
              | plutil -extract CFBundleShortVersionString raw - 2>/dev/null || echo "unknown")
          case "$SPOT_VERSION" in
            9.2.0|9.2.2) ;;
            *)
              echo "::warning::Pixie download manager supports Spotify 9.2.0 and 9.2.2 only (this IPA is $SPOT_VERSION); skipping."
              exit 0 ;;
          esac
          # One target profile per Spotify build. The committed generated headers belong to the
          # default target (9.2.0); write the ones for this IPA before building.
          export PIXIE_TARGET="targets/spotify-$SPOT_VERSION.json"
          python3 NativeDownloads/tools/port/regenerate_headers.py
          python3 NativeDownloads/tools/validate_eevee_9192.py
          EEVEE_DYLIB=$(find "$RUNNER_TEMP/deb-extract" -name 'EeveeSpotify.dylib' | head -1)
          PIXIE_OUT="$RUNNER_TEMP/pixie/$(basename "$OUT_IPA")"
          mkdir -p "$(dirname "$PIXIE_OUT")"
          python3 NativeDownloads/tools/build_eevee_9192.py "$OUT_IPA" \
              --eevee-dylib "$EEVEE_DYLIB" --output "$PIXIE_OUT" > "$RUNNER_TEMP/pixie-report.json"
          mv -f "$PIXIE_OUT" "$OUT_IPA"
          unzip -l "$OUT_IPA" | grep SpotifyAudioProbe.dylib \
              || { echo "::error::SpotifyAudioProbe.dylib missing from IPA"; exit 1; }
          echo "Pixie companion bundled: Payload/Spotify.app/Frameworks/SpotifyAudioProbe.dylib"

      - name: Bundle UVR Inst HQ 4
        if: ${{ inputs.ipa_url != '' && (inputs.uvr_hq4 || inputs.mel_band_roformer) }}
        run: |
          set -euo pipefail
          if ! unzip -Z1 "$OUT_IPA" | grep -Fx 'Payload/Spotify.app/Frameworks/SpotifyAudioProbe.dylib' >/dev/null; then
            echo "::error::UVR HQ 4 requires the Pixie audio companion for Spotify 9.2.0 or 9.2.2."
            exit 1
          fi
          model_dir="$(mktemp -d)"
          trap 'rm -rf "$model_dir"' EXIT
          model_source="$model_dir/model-source.ipa"
          model_url='https://github.com/anton86511/EeveeSpotifyReincarnated/releases/download/v7.5.0-spotify-9.2.2-hq4-nowplaying/EeveeSpotify-9.2.2-UVR-HQ4-NowPlaying.ipa'
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --retry 3             --output "$model_source" -- "$model_url"
          printf '%s  %s\n' 3316a28d783f5f667c307cabc14c9336d3b82e4205ce89d861e0372a0fe62359 "$model_source" | shasum -a 256 -c
          unzip -q "$model_source" 'Payload/Spotify.app/InstHQ4.mlmodelc/*' -d "$model_dir"
          test -s "$model_dir/Payload/Spotify.app/InstHQ4.mlmodelc/weights/weight.bin"
          ipa_path="$(pwd)/$OUT_IPA"
          (cd "$model_dir" && zip -qry "$ipa_path" Payload/Spotify.app/InstHQ4.mlmodelc)
          unzip -tq "$OUT_IPA"

      - name: Fetch compiled Mel-Band RoFormer
        if: ${{ inputs.ipa_url != '' && inputs.mel_band_roformer }}
        uses: actions/download-artifact@v4
        with:
          name: RoFormer-model
          path: ${{ runner.temp }}/roformer

      - name: Bundle Mel-Band RoFormer
        if: ${{ inputs.ipa_url != '' && inputs.mel_band_roformer }}
        run: |
          set -euo pipefail
          model_dir="$RUNNER_TEMP/roformer"
          app="Payload/Spotify.app"
          mkdir -p "$model_dir/$app"
          tar -xf "$model_dir/MelBandRoFormer2s.tar" -C "$model_dir/$app"
          test -s "$model_dir/$app/MelBandRoFormer2s.mlmodelc/weights/weight.bin"
          ipa_path="$PWD/$OUT_IPA"
          (cd "$model_dir" && zip -qry "$ipa_path" \
            "$app/MelBandRoFormer2s.mlmodelc" "$app/MelBandRoFormer-LICENSE.txt")
          unzip -tq "$OUT_IPA"

      - name: Inject OpeninSafariSpotify extension into IPA PlugIns
        if: ${{ inputs.ipa_url != '' }}
        run: |
          cd "$(dirname "$OUT_IPA")"
          rm -rf Payload
          unzip -q "$(basename "$OUT_IPA")"

          mkdir -p "Payload/Spotify.app/PlugIns"
          rm -rf "Payload/Spotify.app/PlugIns/OpenSpotifySafariExtension.appex"
          cp -R "$OPENSPOTIFY_APPEX" "Payload/Spotify.app/PlugIns/OpenSpotifySafariExtension.appex"

          # Repack only the Payload folder back into the IPA
          zip -qry "$(basename "$OUT_IPA")" Payload
          rm -rf Payload

      - name: Strip Watch app (if any survived)
        if: ${{ inputs.ipa_url != '' }}
        run: |
          cd "$(dirname "$OUT_IPA")"
          rm -rf Payload
          unzip -q "$(basename "$OUT_IPA")"
          if [ -d "Payload/Spotify.app/com.apple.WatchPlaceholder" ]; then
            rm -rf Payload/Spotify.app/com.apple.WatchPlaceholder
          fi
          if [ -d "Payload/Spotify.app/Watch" ]; then
            rm -rf Payload/Spotify.app/Watch
          fi
          rm -f "$(basename "$OUT_IPA")"
          zip -qry "$(basename "$OUT_IPA")" Payload
          rm -rf Payload

      - name: Stage alternate app icons
        if: ${{ inputs.ipa_url != '' }}
        run: |
          chmod +x Tools/alt-icons.sh
          Tools/alt-icons.sh "$OUT_IPA"

      - name: Upload IPA artifact
        if: ${{ inputs.ipa_url != '' && (inputs.upload_method == 'artifacts' || inputs.upload_method == 'github_release' || inputs.upload_method == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-IPA
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error

      - name: Upload IPA to filebin.net
        if: ${{ inputs.ipa_url != '' && (inputs.upload_method == 'filebin' || inputs.upload_method == 'both') }}
        run: |
          BIN="eevee-${{ github.run_id }}-${{ github.run_attempt }}"
          FILENAME=$(basename "$OUT_IPA")
          curl -fsS -X POST \
               -H "Content-Type: application/octet-stream" \
               --data-binary "@${OUT_IPA}" \
               "https://filebin.net/${BIN}/${FILENAME}" >/dev/null

          DOWNLOAD_URL="https://filebin.net/${BIN}/${FILENAME}"
          echo "Uploaded to: ${DOWNLOAD_URL}"
          {
            echo "### 📦 filebin.net download"
            echo "- **File:** ${FILENAME}"
            echo "- **URL:** ${DOWNLOAD_URL}"
            echo "- _Filebin auto-deletes bins after a period of inactivity — download promptly._"
          } >> "$GITHUB_STEP_SUMMARY"

  release-roformer:
    needs: build
    if: ${{ github.ref == 'refs/heads/codex/mel-band-roformer-2s' && inputs.branch == github.ref_name && inputs.mel_band_roformer && inputs.upload_method == 'github_release' && inputs.ipa_url != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EeveeSpotify-IPA
      - name: Verify and publish the IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(EeveeSpotify-*-9.2.2.ipa)
          [[ ${#files[@]} -eq 1 ]]
          asset=EeveeSpotify-9.2.2-MelBandRoFormer-2s.ipa
          mv "${files[0]}" "$asset"
          unzip -tq "$asset"
          unzip -Z1 "$asset" > ipa-entries.txt
          for component in MelBandRoFormer2s InstHQ4; do
            grep -Fx "Payload/Spotify.app/$component.mlmodelc/weights/weight.bin" ipa-entries.txt
          done
          grep -Fx 'Payload/Spotify.app/Frameworks/SpotifyAudioProbe.dylib' ipa-entries.txt
          tag="spotify-9.2.2-melband-roformer-2s-$GITHUB_RUN_ID"
          gh release create "$tag" "$asset" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Spotify 9.2.2 · Mel-Band RoFormer Core ML 2 秒' --prerelease --latest=false \
            --notes '加入 Mel-Band RoFormer 2 秒視窗，播放緩衝為 2.75 秒。可選僅 CPU、GPU 優先或 CPU＋GPU。附帶 HQ 4 與原有即時模式。iPhone 實機效能尚待驗證。'
